[project]
name = "indenture"
version = "0.1.0"
description = "Chain of custody for multi-agent systems: who was allowed to hand off to whom, what they passed, and how to replay it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "multi-agent", "audit", "authorization", "provenance", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

authors = [{ name = "Sylvain Cartier" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
indenture = "indenture:main"

[project.urls]
Source = "https://github.com/Sylv-ctr/Indenture"
Issues = "https://github.com/Sylv-ctr/Indenture/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["indenture.py"]
sources = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
